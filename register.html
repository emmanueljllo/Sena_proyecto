<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Confort Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="toast-container" id="toast-container"></div>
    
    <div class="auth-container">
        <!-- Background elements -->
        <div class="hero-bg"><div class="hero-glow"></div></div>
        
        <div class="glass-card auth-box animate-fade-up">
            <div style="text-align:center; margin-bottom: 2rem;">
                <a href="index.html" class="nav-brand" style="font-size: 2rem;">
                    <span class="gold-text">Confort</span> Market
                </a>
            </div>
            
            <h2>Crear Cuenta</h2>
            <p class="auth-subtitle">Únete a la experiencia premium de compras</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <i class="fa-regular fa-user form-icon"></i>
                    <input type="text" id="username" class="form-control" placeholder="Ej. JuanPerez" required minlength="3">
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <i class="fa-regular fa-envelope form-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock form-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
                    <i class="fa-regular fa-eye-slash password-toggle"></i>
                    <div class="password-strength">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <i class="fa-solid fa-shield-check form-icon"></i>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Repite tu contraseña" required minlength="8">
                </div>
                
                <div style="margin-bottom: 1.5rem; font-size: 0.9rem;">
                    <label style="display:flex; align-items:center; gap:0.5rem; margin:0; cursor:pointer;">
                        <input type="checkbox" required style="accent-color: var(--gold-primary);"> 
                        <span>Acepto los <a href="#" style="color:var(--gold-primary);">Términos</a> y <a href="#" style="color:var(--gold-primary);">Privacidad</a></span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                    Crear Cuenta <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
