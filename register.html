<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Confort Market</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="gold-text">Confort</span> Market
        </div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="index.html#bcp-section">Plan BCP</a>
            <a href="index.html#products">Productos</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="hero-background">
            <div class="glow-orb"></div>
        </div>
        <div class="auth-box">
            <h2>Crear <span class="gold-gradient">Cuenta</span></h2>
            <form action="login.html" method="GET">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group" style="position:relative;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" oninput="checkPasswordStrength(this.value)">
                    <div id="password-strength" style="height: 4px; background: rgba(255,255,255,0.1); margin-top: 8px; border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar" style="height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s;"></div>
                    </div>
                    <small id="strength-text" style="color: var(--text-secondary); font-size: 0.8rem; display: block; margin-top: 4px;">Fuerza: Ninguna</small>
                </div>
                <div class="form-group" style="margin-top: 1rem; border: 1px dashed rgba(212,175,55,0.3); padding: 1rem; border-radius: 8px; background: rgba(212,175,55,0.05);">
                    <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin: 0;">
                        <input type="checkbox" required style="width: auto; accent-color: var(--gold-primary); margin-top: 4px;">
                        <span style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4;">Acepto las políticas de seguridad BCP y entiendo que mis datos estarán cifrados de extremo a extremo.</span>
                    </label>
                </div>
                <button type="submit" class="cta-btn" style="margin-top: 1rem;">Registrarse Seguro</button>
            </form>
            <a href="login.html" class="auth-link">¿Ya tienes cuenta? <span>Inicia sesión</span></a>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            let strength = 0;
            
            if (password.length > 5) strength += 1;
            if (password.length > 8) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            switch(strength) {
                case 0:
                    strengthBar.style.width = '0%';
                    strengthText.textContent = 'Fuerza: Ninguna';
                    break;
                case 1:
                case 2:
                    strengthBar.style.width = '33%';
                    strengthBar.style.backgroundColor = '#ff4d4d'; // Red
                    strengthText.textContent = 'Fuerza: Débil';
                    break;
                case 3:
                case 4:
                    strengthBar.style.width = '66%';
                    strengthBar.style.backgroundColor = '#ffa64d'; // Orange
                    strengthText.textContent = 'Fuerza: Media';
                    break;
                case 5:
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = '#4CAF50'; // Green
                    strengthText.textContent = 'Fuerza: Fuerte (Recomendado BCP)';
                    break;
            }
        }
    </script>
</body>
</html>
