<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Confort Market</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="gold-text">Confort</span> Market
        </div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="index.html#bcp-section">Plan BCP</a>
            <a href="index.html#products">Productos</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="hero-background">
            <div class="glow-orb"></div>
        </div>
        <div class="auth-box">
            <h2>Crear <span class="gold-gradient">Cuenta</span></h2>
            <form action="login.html" method="GET">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="cta-btn">Registrarse</button>
            </form>
            <a href="login.html" class="auth-link">¿Ya tienes cuenta? <span>Inicia sesión</span></a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
