<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Confort Market</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <span class="gold-text">Confort</span> Market
        </div>
        <div class="nav-links">
            <a href="register.html">Registro</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="hero-background">
            <div class="glow-orb"></div>
        </div>
        <div class="auth-box">
            <h2>Iniciar <span class="gold-gradient">Sesión</span></h2>
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="cta-btn">Ingresar</button>
            </form>
            <a href="register.html" class="auth-link">¿No tienes cuenta? <span>Regístrate aquí</span></a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
