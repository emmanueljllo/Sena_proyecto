<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Confort Market</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="toast-container" id="toast-container"></div>
    
    <div class="auth-container">
        <!-- Background elements -->
        <div class="hero-bg"><div class="hero-glow"></div></div>
        
        <div class="glass-card auth-box animate-fade-up">
            <div style="text-align:center; margin-bottom: 2rem;">
                <a href="index.html" class="nav-brand" style="display:inline-block;">
                    <img src="assets/logo.png" alt="Confort Market" style="height: 70px;">
                </a>
            </div>
            
            <h2>Bienvenido de Nuevo</h2>
            <p class="auth-subtitle">Inicia sesión en tu cuenta premium</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <i class="fa-regular fa-envelope form-icon"></i>
                    <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <i class="fa-solid fa-lock form-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye-slash password-toggle"></i>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
                    <label style="display:flex; align-items:center; gap:0.5rem; margin:0; cursor:pointer;">
                        <input type="checkbox" style="accent-color: var(--gold-primary);"> Recordarme
                    </label>
                    <a href="#" id="forgot-password-link" style="color:var(--text-secondary); text-decoration:underline;">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <!-- Modal: Olvidé mi contraseña -->
    <div class="modal-overlay" id="forgot-modal" style="display:none;">
        <div class="glass-card modal-box animate-fade-up">
            <button class="modal-close" onclick="closeForgotModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="margin-bottom:0.5rem;">Recuperar <span class="gold-text">Contraseña</span></h3>
            <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:1.5rem;">Ingresa tu correo y escoge una nueva contraseña.</p>

            <div id="forgot-step-1">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <i class="fa-regular fa-envelope form-icon"></i>
                    <input type="email" id="forgot-email" class="form-control" placeholder="tu@email.com">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="verifyForgotEmail()">Verificar Correo</button>
            </div>

            <div id="forgot-step-2" style="display:none;">
                <p style="color:#2ed573; font-size:0.9rem; margin-bottom:1rem;"><i class="fa-solid fa-circle-check"></i> Correo verificado. Escribe tu nueva contraseña.</p>
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <i class="fa-solid fa-lock form-icon"></i>
                    <input type="password" id="forgot-new-password" class="form-control" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="form-group">
                    <label>Confirmar Nueva Contraseña</label>
                    <i class="fa-solid fa-shield-check form-icon"></i>
                    <input type="password" id="forgot-confirm-password" class="form-control" placeholder="Repite la contraseña">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="resetPassword()">Cambiar Contraseña <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
