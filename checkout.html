<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Confort Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth-guard.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loader-logo gold-gradient-text">Confort Market</div>
        <div class="loader-bar"><div class="loader-progress"></div></div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-brand"><span class="gold-text">Confort</span> Market</a>
        <a href="index.html" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size:0.9rem;">
            <i class="fa-solid fa-arrow-left"></i> Volver a Tienda
        </a>
    </nav>

    <div class="checkout-layout">
        <!-- Formulario -->
        <div class="glass-card" style="padding: 2rem;">
            <div class="checkout-steps">
                <div class="step active">1. Datos y Envío</div>
                <div class="step active">2. Pago</div>
                <div class="step">3. Confirmación</div>
            </div>

            <form id="checkout-form">
                <h3 style="margin-bottom: 1.5rem;">Información de Envío</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" class="form-control" style="padding-left:1rem;" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" class="form-control" style="padding-left:1rem;" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Dirección de Envío</label>
                    <input type="text" class="form-control" style="padding-left:1rem;" required>
                </div>

                <h3 style="margin: 2rem 0 1.5rem;">Método de Pago</h3>
                <div class="payment-methods">
                    <div class="payment-method active">
                        <i class="fa-brands fa-cc-visa" style="font-size:2rem; color:var(--text-primary)"></i>
                        <span>Tarjeta</span>
                    </div>
                    <div class="payment-method">
                        <i class="fa-brands fa-cc-paypal" style="font-size:2rem; color:var(--text-primary)"></i>
                        <span>PayPal</span>
                    </div>
                    <div class="payment-method">
                        <i class="fa-solid fa-building-columns" style="font-size:2rem; color:var(--text-primary)"></i>
                        <span>Transferencia</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Número de Tarjeta</label>
                    <i class="fa-regular fa-credit-card form-icon"></i>
                    <input type="text" class="form-control" id="cc-number" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Vencimiento</label>
                        <i class="fa-regular fa-calendar form-icon"></i>
                        <input type="text" class="form-control" id="cc-exp" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <i class="fa-solid fa-lock form-icon"></i>
                        <input type="text" class="form-control" placeholder="123" maxlength="4" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem;">
                    <i class="fa-solid fa-check"></i> Confirmar Pedido
                </button>
            </form>
        </div>

        <!-- Resumen -->
        <div class="cart-summary glass-card" style="padding: 2rem;">
            <h3 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-box"></i> Resumen del Pedido</h3>
            
            <div id="checkout-items" style="max-height: 400px; overflow-y: auto; padding-right: 10px; margin-bottom: 1.5rem;">
                <!-- JS inserta items aquí -->
            </div>

            <div style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Impuestos (19%)</span>
                    <span id="checkout-tax">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span style="color:#2ed573;">Gratis</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
